spring.config.import=optional:file:.env[.properties]
spring.application.name=cineflix
server.port=${PORT:8080}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.model=${EMBEDDING_MODEL}
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME}
spring.ai.vectorstore.pinecone.namespace=movies
spring.ai.openai.embedding.metadata-mode=NONE
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.indexing.enabled=${INDEXING_ENABLED:false}
