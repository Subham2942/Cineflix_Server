services:
  - type: web
    name: cineflix-api
    runtime: docker
    repo: https://github.com/Subham2942/Cineflix_Server.git
    branch: main
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: cineflix-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: INDEXING_ENABLED
        value: "false"

  - type: web
    name: cineflix-web
    runtime: static
    repo: https://github.com/Subham2942/Cineflix_frontend.git
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cineflix-api
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
